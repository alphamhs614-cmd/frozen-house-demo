<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { TeapotGeometry } from 'three/addons/geometries/TeapotGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// ---------- timeline ----------
const T_EXP = 5.0, T_SLOW = 5.55, T_FREEZE = 6.95, T_END = 28.0;
const T_FLY0 = 7.6, T_FLY1 = 24.0;
const SIM_F = 0.55 + (T_FREEZE - T_SLOW) / 3; // sim seconds at freeze (~1.0)
function simTime(t) {
  if (t < T_EXP) return 0;
  if (t < T_SLOW) return t - T_EXP;
  if (t < T_FREEZE) { const d = T_FREEZE - T_SLOW, u = (t - T_SLOW) / d; return 0.55 + d * (1 - Math.pow(1 - u, 3)) / 3; }
  return SIM_F;
}
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
const G = 9.8;

// ---------- rng ----------
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry(1337);
const rr = (a, b) => a + (b - a) * R();
const rsph = () => { let v; do { v = new THREE.Vector3(rr(-1, 1), rr(-1, 1), rr(-1, 1)); } while (v.lengthSq() > 1 || v.lengthSq() < 1e-4); return v; };

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
const PR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false; let lastShadowS = -1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1b2233, 0.013);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.01, 400);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

// ---------- procedural textures ----------
function canvasTex(w, h, draw, repeat = [1, 1], srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]);
  t.anisotropy = 8; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t;
}
function noise(g, w, h, n, a, colA, colB, rmin = 1, rmax = 3) {
  for (let i = 0; i < n; i++) { g.fillStyle = R() < .5 ? colA : colB; g.globalAlpha = a * R(); const r = rr(rmin, rmax); g.beginPath(); g.arc(R() * w, R() * h, r, 0, 7); g.fill(); }
  g.globalAlpha = 1;
}
const plasterTex = canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#d9d0c1'; g.fillRect(0, 0, w, h); noise(g, w, h, 9000, .12, '#fff', '#8a7f70', .5, 2.2); noise(g, w, h, 60, .06, '#6b5f50', '#fff', 20, 60); }, [1, 1]);
const plasterBump = canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#808080'; g.fillRect(0, 0, w, h); noise(g, w, h, 14000, .35, '#fff', '#000', .4, 1.8); }, [1, 1], false);
const roofTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#3a2620'; g.fillRect(0, 0, w, h);
  const rows = 8, cols = 6;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const off = (y % 2) * w / cols / 2, l = 28 + R() * 18;
    g.fillStyle = `hsl(${10 + R() * 10},${35 + R() * 15}%,${l}%)`;
    g.beginPath(); g.roundRect(x * w / cols + off + 2, y * h / rows + 2, w / cols - 4, h / rows - 3, [0, 0, 18, 18]); g.fill();
    g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(x * w / cols + off + 2, y * h / rows + h / rows - 8, w / cols - 4, 6);
  }
  noise(g, w, h, 4000, .15, '#000', '#c9a', .5, 2);
}, [1, 1]);
const woodTex = canvasTex(1024, 1024, (g, w, h) => {
  const pw = h / 8;
  for (let i = 0; i < 8; i++) {
    let x = -R() * 300;
    while (x < w) {
      const len = 250 + R() * 300, hue = 25 + R() * 8, l = 30 + R() * 14;
      g.fillStyle = `hsl(${hue},${45 + R() * 10}%,${l}%)`; g.fillRect(x, i * pw, len, pw);
      for (let k = 0; k < 40; k++) { g.strokeStyle = `rgba(${R() < .5 ? '40,20,8' : '255,220,170'},${R() * .12})`; g.lineWidth = R() * 2 + .5; const yy = i * pw + R() * pw; g.beginPath(); g.moveTo(x, yy); g.bezierCurveTo(x + len * .3, yy + rr(-6, 6), x + len * .7, yy + rr(-6, 6), x + len, yy + rr(-4, 4)); g.stroke(); }
      g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(x, i * pw, 2, pw); x += len;
    }
    g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, i * pw, w, 2);
  }
}, [3, 2.4]);
const grassTex = canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#2f3a22'; g.fillRect(0, 0, w, h); noise(g, w, h, 20000, .25, '#55663a', '#1a2210', .5, 2); noise(g, w, h, 300, .08, '#4a3a22', '#1d2a14', 10, 40); }, [60, 60]);
const fabricTex = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); for (let i = 0; i < w; i += 2) { g.fillStyle = `rgba(0,0,0,${.04 + R() * .05})`; g.fillRect(i, 0, 1, h); g.fillRect(0, i, w, 1); } noise(g, w, h, 2000, .06, '#000', '#fff', .5, 1.5); }, [3, 3]);
const rugTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#7a2e22'; g.fillRect(0, 0, w, h); g.strokeStyle = '#d9b77a'; g.lineWidth = 14; g.strokeRect(30, 30, w - 60, h - 60);
  g.strokeStyle = '#1f3550'; g.lineWidth = 8; g.strokeRect(60, 60, w - 120, h - 120);
  g.translate(w / 2, h / 2); for (let i = 0; i < 12; i++) { g.rotate(Math.PI / 6); g.fillStyle = i % 2 ? '#d9b77a' : '#1f3550'; g.beginPath(); g.ellipse(70, 0, 60, 16, 0, 0, 7); g.fill(); }
  g.setTransform(1, 0, 0, 1, 0, 0); noise(g, w, h, 8000, .12, '#000', '#fff', .5, 1.5);
});
const smokeTex = canvasTex(128, 128, (g, w, h) => {
  for (let i = 0; i < 26; i++) { const x = w / 2 + rr(-26, 26), y = h / 2 + rr(-26, 26), r = rr(14, 34); const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(255,255,255,.22)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); }
}, [1, 1], false);
function paintingTex(seed) {
  const r = mulberry(seed);
  return canvasTex(256, 200, (g, w, h) => {
    const sky = g.createLinearGradient(0, 0, 0, h); const hue = r() * 360;
    sky.addColorStop(0, `hsl(${hue},60%,70%)`); sky.addColorStop(1, `hsl(${(hue + 40) % 360},70%,55%)`); g.fillStyle = sky; g.fillRect(0, 0, w, h);
    for (let k = 0; k < 3; k++) { g.fillStyle = `hsl(${(hue + 120 + k * 30) % 360},${30 + k * 10}%,${45 - k * 10}%)`; g.beginPath(); g.moveTo(0, h); for (let x = 0; x <= w; x += 16) g.lineTo(x, h * (.5 + k * .12) + Math.sin(x * .03 + k + r() * 2) * 18); g.lineTo(w, h); g.fill(); }
    g.fillStyle = `hsl(${hue + 180},80%,85%)`; g.beginPath(); g.arc(w * (.2 + r() * .6), h * .28, 16, 0, 7); g.fill();
  });
}
const clockTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#f4efe4'; g.fillRect(0, 0, w, h); g.translate(w / 2, h / 2); g.fillStyle = '#222';
  for (let i = 0; i < 60; i++) { g.save(); g.rotate(i * Math.PI / 30); g.fillRect(-(i % 5 ? 1.5 : 4), -118, i % 5 ? 3 : 8, i % 5 ? 10 : 22); g.restore(); }
  g.save(); g.rotate(-0.9); g.fillRect(-5, -70, 10, 76); g.restore(); g.save(); g.rotate(1.9); g.fillRect(-3, -100, 6, 106); g.restore(); g.beginPath(); g.arc(0, 0, 8, 0, 7); g.fill();
}, [1, 1]);

// ---------- materials ----------
const M = (c, r = .6, m = 0, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m, envMapIntensity: .12, ...o });
const mats = {
  plaster: M(0xd8d2c8, .92, 0, { map: plasterTex, bumpMap: plasterBump, bumpScale: 1.5 }),
  roof: M(0xffffff, .8, 0, { map: roofTex }),
  trim: M(0xbdb6aa, .6), darkwood: M(0x3b2416, .5), wood: M(0x8a5a36, .55), lightwood: M(0xb98a5a, .5),
  sofa: M(0x4f6b7a, .95, 0, { map: fabricTex }), sofa2: M(0xb8763c, .95, 0, { map: fabricTex }), pillowA: M(0xe0b44a, .95, 0, { map: fabricTex }), pillowB: M(0xc9d1d6, .95, 0, { map: fabricTex }),
  ceramic: M(0xf7f5f0, .18, 0, { envMapIntensity: .35 }), cupBlue: M(0x2f5f8f, .2), cupRed: M(0xb33b2e, .25),
  metal: M(0xc8c8c8, .3, 1), black: M(0x111111, .35), screen: M(0x050608, .1, 0, { emissive: 0x2a3d66, emissiveIntensity: .6 }),
  leaf: M(0x2e5a2a, .7, 0, { side: THREE.DoubleSide }), pot: M(0xa65a35, .8), glassFrame: M(0x2a2a2a, .4, .5),
  white: M(0xf0f0f0, .4), fridge: M(0xe9e9e6, .25, .2), counter: M(0x5c5f63, .35), shade: M(0xf3e3c3, .9, 0, { emissive: 0xffc27a, emissiveIntensity: 1.5, side: THREE.DoubleSide }),
  bulb: M(0xffffff, .2, 0, { emissive: 0xffd9a0, emissiveIntensity: 8 }),
  winGlow: new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffb866, emissiveIntensity: 2.6, roughness: .2 }),
  glass: new THREE.MeshStandardMaterial({ color: 0xcfe6ff, roughness: .02, metalness: .1, transparent: true, opacity: .35, envMapIntensity: .8, side: THREE.DoubleSide }),
  concrete: M(0x8d8a84, .95, 0, { bumpMap: plasterBump, bumpScale: 2 }),
  floor: M(0xffffff, .45, 0, { map: woodTex, envMapIntensity: .2 }),
  grass: M(0xffffff, 1, 0, { map: grassTex }), stone: M(0x77736c, .9, 0, { bumpMap: plasterBump, bumpScale: 3 }),
  rug: M(0xffffff, 1, 0, { map: rugTex }), bark: M(0x3a2a1e, .95), foliage: M(0x23401f, .85, 0, { flatShading: true }),
};
const bookColors = [0x8b2b2b, 0x23465f, 0x2f5a3a, 0xc2a14a, 0x5a3a6b, 0xd9d2c2, 0x1c1c1c, 0xa65a35, 0x406a80];
const bookMats = bookColors.map(c => M(c, .7));

// ---------- helpers ----------
function mesh(geo, mat, x = 0, y = 0, z = 0, parent) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; if (parent) parent.add(m); return m; }
const box = (w, h, d, mat, x, y, z, p, r = 0) => mesh(r ? new RoundedBoxGeometry(w, h, d, 3, r) : new THREE.BoxGeometry(w, h, d), mat, x, y, z, p);
const cyl = (rt, rb, h, mat, x, y, z, p, seg = 24) => mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat, x, y, z, p);

const FLOOR_Y = 0.25, WALL_H = 3.0, HX = 4.5, HZ = 3.5, RIDGE = 5.3;
const O = new THREE.Vector3(-3.0, 1.1, -1.6);         // explosion origin (kitchen)
const MOUSE = new THREE.Vector3(1.35, FLOOR_Y, 1.55);  // the mouse

// flyers: groups that are displaced by the explosion
const flyers = [];
function addFlyer(obj, opt = {}) { scene.add(obj); flyers.push({ obj, p0: obj.position.clone(), q0: obj.quaternion.clone(), size: opt.size || .5, opt }); return obj; }

// ---------- environment ----------
{ // sky dome
  const g = new THREE.SphereGeometry(300, 48, 24);
  const m = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false, uniforms: { uSun: { value: new THREE.Vector3(-0.75, 0.08, 0.65).normalize() } },
    vertexShader: `varying vec3 vD; void main(){ vD=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); gl_Position.z=gl_Position.w*.9999; }`,
    fragmentShader: `uniform vec3 uSun; varying vec3 vD; void main(){ float h=vD.y; vec3 top=vec3(.035,.06,.16); vec3 mid=vec3(.20,.22,.42); vec3 hor=vec3(1.0,.45,.22);
      vec3 c=mix(hor, mid, smoothstep(-.02,.18,h)); c=mix(c, top, smoothstep(.15,.7,h)); c=mix(vec3(.05,.05,.07),c,smoothstep(-.08,0.,h));
      float s=max(dot(vD,uSun),0.); c+=vec3(1.,.5,.2)*pow(s,8.)*.9 + vec3(1.,.7,.4)*pow(s,300.)*6.; gl_FragColor=vec4(c*1.25,1.); }` });
  scene.add(new THREE.Mesh(g, m));
}
const ground = mesh(new THREE.PlaneGeometry(400, 400), mats.grass, 0, 0, 0, scene); ground.rotation.x = -Math.PI / 2; ground.castShadow = false;
{ // path stones + slab
  box(HX * 2 + .3, FLOOR_Y, HZ * 2 + .3, mats.concrete, 0, FLOOR_Y / 2, 0, scene);
  for (let i = 0; i < 12; i++) { const s = cyl(.32 + R() * .06, .34, .06, mats.stone, rr(-.15, .15), .03, HZ + 1 + i * .75, scene, 9); s.rotation.y = R() * 3; s.scale.z = .75; }
  // trees
  const tree = (x, z, s) => { const t = new THREE.Group(); cyl(.12 * s, .2 * s, 3 * s, mats.bark, 0, 1.5 * s, 0, t, 8); for (let i = 0; i < 7; i++) { const f = mesh(new THREE.IcosahedronGeometry(rr(.9, 1.5) * s, 1), mats.foliage, rr(-.8, .8) * s, rr(3, 4.6) * s, rr(-.8, .8) * s, t); f.scale.y = .8; } t.position.set(x, 0, z); scene.add(t); };
  tree(-9, -2, 1.3); tree(8.5, -4, 1.5); tree(-7.5, 6, 1.0); tree(10, 7, 1.1); tree(-14, -9, 1.6); tree(15, -10, 1.7);
  // fence
  for (const sx of [-1, 1]) { for (let i = 0; i <= 8; i++) box(.08, .9, .08, mats.trim, sx * (6 + i * .9), .45, 8.5, scene); box(7.4, .07, .05, mats.trim, sx * 9.6, .75, 8.5, scene); box(7.4, .07, .05, mats.trim, sx * 9.6, .35, 8.5, scene); }
  // neighbour houses (far silhouettes with lit windows)
  const nh = (x, z, ry) => { const h = new THREE.Group(); box(7, 3.5, 6, M(0x55504a, .9), 0, 1.75, 0, h); const r = mesh(new THREE.CylinderGeometry(0, 4.8, 2.2, 4, 1), M(0x2a1e1a, .9), 0, 4.6, 0, h); r.rotation.y = Math.PI / 4; r.scale.set(1.05, 1, .9);
    for (let i = -1; i <= 1; i += 2) box(1, 1, .05, mats.winGlow, i * 1.8, 2, 3.02, h); h.position.set(x, 0, z); h.rotation.y = ry; scene.add(h); };
  nh(-24, -18, .4); nh(22, -22, -.3); nh(-36, 4, 1.2); nh(34, 2, -1.1);
}

// ---------- the house ----------
const floorMesh = mesh(new THREE.PlaneGeometry(HX * 2 - .2, HZ * 2 - .2), mats.floor, 0, FLOOR_Y + .002, 0, scene); floorMesh.rotation.x = -Math.PI / 2; floorMesh.castShadow = false;
const rug = mesh(new THREE.PlaneGeometry(3.0, 2.0), mats.rug, 2.2, FLOOR_Y + .006, -1.1, scene); rug.rotation.x = -Math.PI / 2; rug.castShadow = false;
{ // scorch decal near origin
  const sc = canvasTex(256, 256, (g, w, h) => { const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2); gr.addColorStop(0, 'rgba(0,0,0,.95)'); gr.addColorStop(.6, 'rgba(10,5,0,.6)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
  var scorchMat = new THREE.MeshBasicMaterial({ map: sc, transparent: true, depthWrite: false, opacity: 0 });
  const s1 = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), scorchMat); s1.rotation.x = -Math.PI / 2; s1.position.set(O.x + .5, FLOOR_Y + .01, O.z + .3); scene.add(s1);
  const s2 = new THREE.Mesh(new THREE.PlaneGeometry(.5, .5), new THREE.MeshBasicMaterial({ map: sc, transparent: true, depthWrite: false, opacity: .9 })); s2.rotation.x = -Math.PI / 2; s2.position.set(MOUSE.x, FLOOR_Y + .011, MOUSE.z); scene.add(s2);
}

// wall + roof chunks as instanced meshes
const chunkList = []; // {p0,q0,s, F, rot axis, ang, mesh, idx}
const openings = [ // [wall, a0, a1, y0, y1]  a = coordinate along wall
  ['F', -.55, .55, 0, 2.2], ['F', -3.3, -1.7, 1.0, 2.3], ['F', 1.7, 3.3, 1.0, 2.3],
  ['B', -3.0, -1.6, 1.0, 2.3], ['B', 1.6, 3.0, 1.0, 2.3], ['L', -1.0, 1.0, 1.0, 2.3], ['Rw', -1.0, 1.0, 1.0, 2.3]];
const CELL = 0.5, TH = 0.22;
function inOpening(w, a, y) { return openings.some(o => o[0] === w && a > o[1] && a < o[2] && y > o[3] && y < o[4]); }
function addWall(w) {
  const along = (w === 'F' || w === 'B') ? HX : HZ, n = Math.round(along * 2 / CELL);
  for (let i = 0; i < n; i++) for (let j = 0; j < 12; j++) {
    const a = -along + (i + .5) * CELL, y = (j + .5) * CELL;
    let top = WALL_H;
    if (w === 'L' || w === 'Rw') top = WALL_H + (RIDGE - WALL_H - .15) * (1 - Math.abs(a) / HZ);
    if (y > top) continue;
    if (inOpening(w, a, y)) continue;
    const p = new THREE.Vector3(); let rotY = 0;
    if (w === 'F') p.set(a, FLOOR_Y + y, HZ); else if (w === 'B') p.set(a, FLOOR_Y + y, -HZ);
    else if (w === 'L') { p.set(-HX, FLOOR_Y + y, a); rotY = Math.PI / 2; } else { p.set(HX, FLOOR_Y + y, a); rotY = Math.PI / 2; }
    chunkList.push({ kind: 'wall', p0: p, q0: new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), rotY), s: new THREE.Vector3(CELL + .002, CELL + .002, TH), row: j });
  }
}
['F', 'B', 'L', 'Rw'].forEach(addWall);
{ // roof slopes
  const rise = RIDGE - WALL_H, run = HZ + .45, slope = Math.hypot(rise + .25, run), ang = Math.atan2(rise + .25, run);
  const nx = 14, nz = 7, lx = (HX + .45) * 2 / nx, lz = slope / nz;
  for (const side of [1, -1]) for (let i = 0; i < nx; i++) for (let k = 0; k < nz; k++) {
    const x = -(HX + .45) + (i + .5) * lx, d = (k + .5) * lz;
    const z = side * (run - d * Math.cos(ang)), y = FLOOR_Y + WALL_H - .25 + d * Math.sin(ang) + .08;
    const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), side * ang);
    chunkList.push({ kind: 'roof', p0: new THREE.Vector3(x, y, z), q0: q, s: new THREE.Vector3(lx + .004, .14, lz + .004) });
  }
}
// rubble pieces (small irregular)
for (let i = 0; i < 900; i++) {
  const src = chunkList[Math.floor(R() * chunkList.length)];
  const p = src.p0.clone().add(new THREE.Vector3(rr(-.25, .25), rr(-.25, .25), rr(-.1, .1)));
  const s = rr(.04, .16);
  chunkList.push({ kind: 'rubble', p0: p, q0: new THREE.Quaternion().setFromEuler(new THREE.Euler(R() * 6, R() * 6, R() * 6)), s: new THREE.Vector3(s, s * rr(.5, 1), s * rr(.6, 1.2)), mat: src.kind });
}

// ---------- interior objects ----------
function sofa() {
  const g = new THREE.Group(), m = mats.sofa;
